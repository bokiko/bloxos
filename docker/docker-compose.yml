version: "3.8"

services:
  hub:
    build:
      context: ../hub
      dockerfile: ../docker/Dockerfile.hub
    ports:
      - "4000:4000"
    volumes:
      - hub-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_HUB_URL=http://hub:4000
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:
