name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Shared Protocol Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          # This standard-library-only module has no go.sum.
          cache: false

      - name: Vet shared protocols
        run: go vet ./...

      - name: Test shared protocols with the race detector
        run: go test -race -count=1 ./...

  hub:
    name: Hub Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: hub/go.sum

      - name: Vet hub
        run: go vet ./...

      - name: Run hub tests
        run: go test -count=1 ./...

      - name: Test backup failure and restart handling
        run: python3 ../scripts/test_backup_compose.py

      - name: Test wrong-installation upgrade safeguards
        run: python3 -m unittest discover -s ../scripts/tests -p 'test_upgrade*.py'
      - name: Host updater transaction tests
        run: python3 -m unittest discover -s ../scripts/tests -p 'test_updater*.py'

      - name: Test native agent bundle validation and staging
        run: |
          python3 ../scripts/test_agent_bundle.py
          bash -n ../scripts/export-agent-bundle.sh

      # Runs in THIS job because it needs both toolchains: the packer is
      # Python, and it drives the hub's real Go loader over the tree an
      # unchanged updater produced. Deliberately before publication — a
      # tag-time test finds a broken release after the tag exists, and the
      # fleet is who finds out.
      - name: Test agent payload packaging and old-worker transport
        run: python3 ../scripts/test_server_bundle_agents.py

      # Runs the real hub PROCESS. A loader unit test cannot catch the gate
      # being moved after the database opens, and the fixtures need root-owned
      # paths because the trusted-binary rule demands root ownership of every
      # ancestor. REQUIRE_ROOT makes a missing prerequisite fail rather than
      # skip: a skip reads exactly like a pass in the checks summary, and this
      # file exists to catch a check that has quietly stopped running.
      #
      # This form proves the gate is wired and reachable. It does NOT verify
      # the release build sets the marker — the flag is supplied here. The
      # image-built hub is covered by the Compose smoke job.
      - name: Test release identity gate, history and workflow wiring
        run: |
          python3 ../scripts/test_release_identity.py
          python3 ../scripts/test_release_history.py
          python3 ../scripts/test_release_workflow.py

      - name: Hub delivery boot gate (source build)
        run: sudo -E env "PATH=$PATH" BLOXOS_BOOT_SMOKE_REQUIRE_ROOT=1 python3 ../scripts/test_hub_bundle_boot.py

  # A real gate as of issue #60: the hub's DB handle and agent registry now live
  # on a Server instance, so tests build isolated servers instead of reassigning
  # package globals under leaked agent-WS goroutines. Verified stable across four
  # consecutive full runs before this was made blocking.
  #
  # If this job starts failing, treat it as a real finding. It is no longer the
  # known-red job it used to be, and the whole point of flipping it was that a
  # permanently-red gate trains everyone to ignore red CI.
  hub-race:
    name: Hub Tests (race)
    runs-on: ubuntu-latest
    # The full suite can exceed 15m on hosted runners with race-instrumented
    # bcrypt setup (PR208 reached the Windows tests before the old deadline).
    # Allow headroom without disabling the hang guard. Keep Go's
    # deadline below the job limit so failures include goroutine stacks.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: hub/go.sum

      - name: Run hub tests with the race detector
        run: go test -race -count=1 -timeout=20m ./...

  agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: agent/go.sum

      - name: Vet agent
        run: go vet ./...

      # tls_insecure.go and tls_insecure_test.go are both behind //go:build
      # insecure, so a bare `go test ./...` never builds either one. Vet gets
      # the compile coverage; the test run is what actually exercises
      # tls_insecure_test.go, which has never executed in CI.
      - name: Vet agent with the insecure build tag
        run: go vet -tags insecure ./...

      - name: Run agent tests with the insecure build tag
        run: go test -tags insecure -count=1 ./...

      - name: Run agent tests
        run: go test -count=1 ./...

      # The power journal, ACK mailbox, sampler goroutines and the connection
      # loop are the agent's most concurrent code; a green ordinary run does
      # not cover that class of bug. Same gate the hub and proto jobs have.
      - name: Run agent tests with the race detector
        run: go test -race -count=1 ./...

  # ~1,600 lines of *_windows.go were never compiled by CI. A windows-latest
  # runner costs the same as a GOOS=windows cross-build and also runs the tests.
  agent-windows:
    name: Agent Tests (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: agent/go.sum

      - name: Vet agent
        run: go vet ./...

      - name: Run agent tests
        run: go test -count=1 ./...

      # Service commands drive the real service control manager. The runner
      # is elevated, so these install this test binary as uniquely named
      # services with slow and stuck stop handlers and a self-restarting
      # instance, then remove them. Opt-in via the env gate; without it the
      # tests skip, and with it a non-elevated process fails rather than skips.
      - name: Run service control manager tests
        env:
          BLOXOS_SCM_TEST: "1"
        run: go test -count=1 -v -run 'TestSCM' ./...

  dashboard:
    name: Dashboard Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        run: pnpm lint

      - name: Test dashboard
        run: pnpm test

      - name: Build dashboard
        env:
          BLOXOS_BUILD_VERSION: ${{ github.ref_name }}
          BLOXOS_BUILD_REVISION: ${{ github.sha }}
        run: pnpm build

      - name: Verify production dashboard build identity
        env:
          EXPECT_VERSION: ${{ github.ref_name }}
          EXPECT_REVISION: ${{ github.sha }}
        run: node scripts/test-build-info.mjs
