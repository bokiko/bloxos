name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Shared Protocol Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          # This standard-library-only module has no go.sum.
          cache: false

      - name: Vet shared protocols
        run: go vet ./...

      - name: Test shared protocols with the race detector
        run: go test -race -count=1 ./...

  hub:
    name: Hub Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: hub/go.sum

      - name: Vet hub
        run: go vet ./...

      - name: Run hub tests
        run: go test -count=1 ./...

      - name: Test backup failure and restart handling
        run: python3 ../scripts/test_backup_compose.py

  # A real gate as of issue #60: the hub's DB handle and agent registry now live
  # on a Server instance, so tests build isolated servers instead of reassigning
  # package globals under leaked agent-WS goroutines. Verified stable across four
  # consecutive full runs before this was made blocking.
  #
  # If this job starts failing, treat it as a real finding. It is no longer the
  # known-red job it used to be, and the whole point of flipping it was that a
  # permanently-red gate trains everyone to ignore red CI.
  hub-race:
    name: Hub Tests (race)
    runs-on: ubuntu-latest
    # The full suite can exceed 10m on hosted runners with race-instrumented
    # bcrypt setup. Allow headroom without disabling the hang guard. Keep Go's
    # deadline below the job limit so failures include goroutine stacks.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: hub/go.sum

      - name: Run hub tests with the race detector
        run: go test -race -count=1 -timeout=15m ./...

  agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: agent/go.sum

      - name: Vet agent
        run: go vet ./...

      # tls_insecure.go and tls_insecure_test.go are both behind //go:build
      # insecure, so a bare `go test ./...` never builds either one. Vet gets
      # the compile coverage; the test run is what actually exercises
      # tls_insecure_test.go, which has never executed in CI.
      - name: Vet agent with the insecure build tag
        run: go vet -tags insecure ./...

      - name: Run agent tests with the insecure build tag
        run: go test -tags insecure -count=1 ./...

      - name: Run agent tests
        run: go test -count=1 ./...

      # The power journal, ACK mailbox, sampler goroutines and the connection
      # loop are the agent's most concurrent code; a green ordinary run does
      # not cover that class of bug. Same gate the hub and proto jobs have.
      - name: Run agent tests with the race detector
        run: go test -race -count=1 ./...

  # ~1,600 lines of *_windows.go were never compiled by CI. A windows-latest
  # runner costs the same as a GOOS=windows cross-build and also runs the tests.
  agent-windows:
    name: Agent Tests (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: agent/go.sum

      - name: Vet agent
        run: go vet ./...

      - name: Run agent tests
        run: go test -count=1 ./...

      # Service commands drive the real service control manager. The runner
      # is elevated, so these install this test binary as uniquely named
      # services with slow and stuck stop handlers and a self-restarting
      # instance, then remove them. Opt-in via the env gate; without it the
      # tests skip, and with it a non-elevated process fails rather than skips.
      - name: Run service control manager tests
        env:
          BLOXOS_SCM_TEST: "1"
        run: go test -count=1 -v -run 'TestSCM' ./...

  dashboard:
    name: Dashboard Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        run: pnpm lint

      - name: Test dashboard
        run: pnpm test

      - name: Build dashboard
        run: pnpm build
