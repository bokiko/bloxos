name: Docker

on:
  pull_request:
    paths:
      - "Dockerfile.hub"
      - "Dockerfile.dashboard"
      - ".dockerignore"
      - "docker/**"
      - "scripts/smoke/**"
      - "scripts/backup-compose.sh"
      - "scripts/agent_bundle.py"
      - "scripts/export-agent-bundle.sh"
      - "scripts/test_agent_bundle.py"
      - "hub/**"
      - "agent/**"
      - "proto/**"
      - "dashboard/**"
      - ".github/workflows/docker.yml"
      - ".github/workflows/ci.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/bloxos-hub
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/bloxos-dashboard

jobs:
  # A release tag must pass the same full suite as a PR, at the tag's exact
  # commit. A green older main/PR run does not validate a new tagged tree.
  verify-release:
    name: Release verification
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # Builds both images for the runner's platform and enrolls the runner as an
  # agent through the Compose stack (scripts/smoke/compose-enroll.sh). Gates
  # publishing and checks container-related pull requests.
  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          load: true
          tags: ${{ env.HUB_IMAGE }}:latest
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dashboard
          load: true
          tags: ${{ env.DASHBOARD_IMAGE }}:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=max
      - name: Enroll the runner through the stack
        env:
          SMOKE_CONFIRM_DISPOSABLE: "1"
          HUB_HOST: 127.0.0.1
        run: scripts/smoke/compose-enroll.sh

  # Multi-platform build and push, version tags only. This is the only job
  # with package write permission. Both images are pushed by digest first,
  # with no tags, and promoted to the version and latest tags only after
  # both pushes succeeded, so a failed build never leaves a mixed pair
  # behind the default tags.
  publish:
    name: Publish images
    needs: [smoke, verify-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      hub_digest: ${{ steps.hub.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate the release tag before publishing any images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/agent_bundle.py validate-tag --version "$RELEASE_TAG"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push hub image by digest
        id: hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.HUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hub
      - name: Push dashboard image by digest
        id: dashboard
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.DASHBOARD_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dashboard
      - name: Promote both images to the version and latest tags
        env:
          VERSION: ${{ github.ref_name }}
          HUB_DIGEST: ${{ steps.hub.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          hub_tags=(-t "$HUB_IMAGE:$version")
          dashboard_tags=(-t "$DASHBOARD_IMAGE:$version")
          if [[ "$VERSION" != *-* ]]; then
            hub_tags+=(-t "$HUB_IMAGE:latest")
            dashboard_tags+=(-t "$DASHBOARD_IMAGE:latest")
          fi
          docker buildx imagetools create "${hub_tags[@]}" "$HUB_IMAGE@$HUB_DIGEST"
          docker buildx imagetools create "${dashboard_tags[@]}" "$DASHBOARD_IMAGE@$DASHBOARD_DIGEST"

  native-bundle:
    name: Package native agents
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract and check the exact published agent bytes
        env:
          HUB_DIGEST: ${{ needs.publish.outputs.hub_digest }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/export-agent-bundle.sh "$HUB_IMAGE@$HUB_DIGEST" "$SOURCE_SHA" "$RELEASE_TAG" "$RUNNER_TEMP/native-agents"
      - name: Attach native payloads to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            prerelease_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease_flags=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease_flags[@]}" --title "BloxOS $RELEASE_TAG" \
              --notes "Release verification passed. Native payloads are extracted from the published image; operator review and final release notes are pending. Fleet signatures are installation-specific and are not included."
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/native-agents/agent-manifest.json" \
            "$RUNNER_TEMP/native-agents/agent-manifest.sha256" \
            "$RUNNER_TEMP/native-agents/bloxos-agent-linux-amd64" \
            "$RUNNER_TEMP/native-agents/bloxos-agent-linux-arm64" \
            "$RUNNER_TEMP/native-agents/bloxos-agent-windows-amd64.exe"
